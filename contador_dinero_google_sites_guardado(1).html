<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de dinero</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
  }
  .contador {
    width: min(100%, 520px);
    padding: 28px;
    background: white;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .total {
    margin: 18px 0 24px;
    font-size: clamp(42px, 10vw, 64px);
    font-weight: 800;
    color: #1f2937;
    word-break: break-word;
  }
  .estado {
    min-height: 20px;
    margin: -10px 0 16px;
    font-size: 13px;
    color: #6b7280;
  }
  .botones {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  button {
    min-height: 54px;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sumar { background: #22c55e; color: white; }
  .sumar:hover { background: #16a34a; }
  .reiniciar {
    width: 100%;
    margin-top: 14px;
    background: #ef4444;
    color: white;
  }
  .reiniciar:hover { background: #dc2626; }
  button:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 2px;
  }
  @media (min-width: 560px) {
    .botones { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
  <main class="contador">
    <h1>💰 Contador de dinero</h1>
    <div id="total" class="total" aria-live="polite">0,00 €</div>
    <div id="estado" class="estado" aria-live="polite">Guardado automáticamente</div>

    <div class="botones" aria-label="Botones para sumar dinero">
      <button class="sumar" type="button" data-cantidad="3">+3 €</button>
      <button class="sumar" type="button" data-cantidad="5">+5 €</button>
      <button class="sumar" type="button" data-cantidad="15">+15 €</button>
      <button class="sumar" type="button" data-cantidad="25">+25 €</button>
      <button class="sumar" type="button" data-cantidad="50">+50 €</button>
    </div>

    <button id="reiniciar" class="reiniciar" type="button">🔄 Reiniciar</button>
  </main>

<script>
(() => {
  const CLAVE = "contador_dinero_total";
  let total = 0;

  const totalElemento = document.getElementById("total");
  const estadoElemento = document.getElementById("estado");

  function cargar() {
    try {
      const guardado = localStorage.getItem(CLAVE);
      const numero = Number(guardado);
      if (Number.isFinite(numero) && numero >= 0) {
        total = numero;
      }
    } catch (error) {
      total = 0;
      estadoElemento.textContent = "Guardado local no disponible";
    }
  }

  function guardar() {
    try {
      localStorage.setItem(CLAVE, String(total));
      estadoElemento.textContent = "Guardado automáticamente";
    } catch (error) {
      estadoElemento.textContent = "No se pudo guardar en este navegador";
    }
  }

  function actualizar() {
    totalElemento.textContent = total.toLocaleString("es-ES", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " €";
  }

  document.querySelectorAll("[data-cantidad]").forEach((boton) => {
    boton.addEventListener("click", () => {
      const cantidad = Number(boton.dataset.cantidad);
      if (Number.isFinite(cantidad) && cantidad > 0) {
        total += cantidad;
        actualizar();
        guardar();
      }
    });
  });

  document.getElementById("reiniciar").addEventListener("click", () => {
    total = 0;
    actualizar();
    guardar();
  });

  cargar();
  actualizar();
})();
</script>
</body>
</html>
